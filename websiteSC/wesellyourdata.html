<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard | Biometric Office System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2c3e50;
            --primary-light: #34495e;
            --accent: #e67e22;
            --accent-hover: #d35400;
            --success: #27ae60;
            --danger: #e74c3c;
            --info: #3498db;
            --warning: #f39c12;
            --bg-dark: #0a0e1a;
            --bg-card: #1a1f35;
            --text-primary: #ecf0f1;
            --text-secondary: #95a5a6;
            --border: rgba(255, 255, 255, 0.1);
            --glow: rgba(230, 126, 34, 0.3);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(230, 126, 34, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(230, 126, 34, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .background-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, var(--glow) 0%, transparent 50%);
            animation: glowPulse 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .fingerprint-icon {
            width: 50px;
            height: 50px;
            color: var(--accent);
            filter: drop-shadow(0 0 10px var(--glow));
        }

        .logo-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .connection-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid var(--success);
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .status-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--success);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 968px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .column-left, .column-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Panel Styles */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .panel-badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Temperature Panel */
        .temp-humidity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .sensor-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .sensor-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
        }

        .sensor-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            color: var(--accent);
            filter: drop-shadow(0 0 8px var(--glow));
        }

        .sensor-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-family: 'Playfair Display', serif;
        }

        .sensor-unit {
            font-size: 18px;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .sensor-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .sensor-timestamp {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 8px;
            opacity: 0.7;
        }

        /* Enrollment Panel */
        .enrollment-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
        }

        /* Action Buttons */
        .action-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .btn-label {
            font-size: 15px;
            font-weight: 600;
        }

        .btn-sublabel {
            font-size: 11px;
            opacity: 0.8;
        }

        /* Occupants List */
        .occupants-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            overflow-y: auto;
            min-height: 210px;
            max-height: 210px;
            align-content: start;
        }

        .occupants-section {
            grid-column: 1 / -1;
        }

        .occupant-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .occupant-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
        }

        .occupant-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .occupant-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Activity Feed */
        .activity-feed {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 672px;
        }

        .activity-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .activity-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(4px);
        }

        .activity-item.entering {
            border-left-color: var(--success);
        }

        .activity-item.exiting {
            border-left-color: var(--info);
        }

        .activity-item.denied {
            border-left-color: var(--danger);
        }

        .activity-time {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            min-width: 80px;
        }

        .activity-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .activity-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .activity-action {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .activity-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .activity-badge.entering {
            background: rgba(39, 174, 96, 0.2);
            color: var(--success);
        }

        .activity-badge.exiting {
            background: rgba(52, 152, 219, 0.2);
            color: var(--info);
        }

        .activity-badge.denied {
            background: rgba(231, 76, 60, 0.2);
            color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-state svg {
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Statistics Grid */
        .statistics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
            font-family: 'Playfair Display', serif;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 16px 20px;
            min-width: 300px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast-message {
            font-size: 14px;
            color: var(--text-primary);
        }

        .clear-btn {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
    </style>
</head>

    <!-- Animated Background -->
    <div class="background-grid"></div>
    <div class="background-glow"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">

                    </svg>
                </div>
                <div class="logo-text">
                    <h1>Security Dashboard</h1>
                    <span class="tagline">Biometric Office Management</span>
                </div>
            </div>
            <div class="connection-badge" id="connection-badge">
                <span class="status-dot"></span>
                <span class="status-text">Connected</span>
            </div>
        </header>

        <!-- Main Dashboard Grid -->
        <div class="dashboard-grid">
            
            <!-- Left Column: Enrollment & Environment -->
            <div class="column-left">
                
                <!-- Enrollment Panel -->
                <section class="panel">
                    <div class="panel-header">
                        <h2>Enroll New User</h2>
                    </div>
                    <div class="enrollment-form">
                        <div class="form-group">
                            <label for="userName">User Name</label>
                            <input type="text" id="userName" placeholder="Enter full name">
                        </div>
                        <div class="form-group">
                            <label for="userId">User ID</label>
                            <input type="number" id="userId" placeholder="ID (1-100)" min="1" max="100">
                        </div>
                        <button class="action-btn" onclick="sendEnroll()">
                            <div class="btn-icon">
                                <svg viewBox="0 0 24 24" width="24" height="24">

                                </svg>
                            </div>
                            <div class="btn-content">
                                <span class="btn-label">Start Enrollment</span>
                                <span class="btn-sublabel">Register fingerprint</span>
                            </div>
                        </button>
                        <div class="statistics-grid">
                            <div class="stat-card">
                                <div class="stat-value" id="total-entries">0</div>
                                <div class="stat-label">Events Today</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value" id="active-count">0</div>
                                <div class="stat-label">In Building</div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Temperature & Humidity Panel -->
                <section class="panel">
                    <div class="panel-header">
                        <h2>Environmental Monitoring</h2>
                    </div>
                    <div class="temp-humidity-grid">
                        <!-- Temperature Card -->
                        <div class="sensor-card">
                            <svg class="sensor-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
                            </svg>
                            <div class="sensor-value" id="temperature-value">--</div>
                            <div class="sensor-label">Temperature</div>
                        </div>
                        
                        <!-- Humidity Card -->
                        <div class="sensor-card">
                            <svg class="sensor-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                            </svg>
                            <div class="sensor-value" id="humidity-value">--</div>
                            <div class="sensor-label">Humidity</div>
                        </div>
                    </div>
                </section>

            </div>

            <!-- Right Column: Activity Feed -->
            <div class="column-right">
                
                <!-- Recent Activity Panel -->
                <section class="panel" style="flex: 1;">
                    <div class="panel-header">
                        <h2>Recent Activity</h2>
                        <button class="clear-btn" onclick="clearActivity()">Clear</button>
                    </div>
                    <div class="activity-feed" id="logBody">
                        <div class="empty-state">
                            <svg viewBox="0 0 100 100" width="60" height="60">
                                <rect x="20" y="30" width="60" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                                <rect x="20" y="46" width="40" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                                <rect x="20" y="62" width="50" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                            </svg>
                            <p>No recent activity</p>
                        </div>
                    </div>
                </section>

            </div>
        </div>

        <!-- Full Width: Current Occupants Panel -->
        <section class="panel occupants-section">
            <div class="panel-header">
                <h2>In The Building</h2>
                <span class="panel-badge" id="occupant-count">0</span>
            </div>
            <div class="occupants-list" id="insideList">
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <svg viewBox="0 0 100 100" width="60" height="60">
                        <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
                    </svg>
                    <p>No one in the building</p>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>Security Biometric System &copy; 2026</p>
                <p class="system-info" id="system-info">Auto-refresh: 3s</p>
            </div>
        </footer>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<div class="toast-message">${message}</div>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Fetch temperature data from your API endpoint
        async function fetchTemperatureData() {
            const API_URL = "https://bhwtkngcic.execute-api.us-east-1.amazonaws.com/default/GetLatestEnvironment";
            
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                console.log("Raw data from API:", data);
                
                // Logic for Temperature
                const t = data.payload ? data.payload.temperature : data.temperature;
                if (t !== undefined) {
                    document.getElementById('temperature-value').innerHTML = `${Number(t).toFixed(1)}<span class="sensor-unit">°C</span>`;
                }
                
                // Logic for Humidity
                const h = data.payload ? data.payload.humidity : data.humidity;
                if (h !== undefined) {
                    document.getElementById('humidity-value').innerHTML = `${Number(h).toFixed(1)}<span class="sensor-unit">%</span>`;
                }
            } catch (error) {
                console.error("Temperature fetch error:", error);
            }
        }

        // 1. SEND ENROLL COMMAND
        async function sendEnroll() {
            const name = document.getElementById('userName').value;
            const id = document.getElementById('userId').value;
            const url = "https://rvejem3755.execute-api.us-east-1.amazonaws.com/default/SendEnrollCommand";

            if (!name || !id) {
                showToast('Please fill in both fields!', 'error');
                return;
            }
            
            try {
                await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify({ "user_name": name, "user_id": id })
                });
                showToast(`Enrollment started for ${name} (ID: ${id})`, 'success');
                document.getElementById('userName').value = '';
                document.getElementById('userId').value = '';
            } catch (error) {
                showToast('Enrollment failed. Please try again.', 'error');
            }
        }

        // 2. REFRESH DASHBOARD DATA
        async function refreshDashboard() {
            const url = "https://77g3ew7bxi.execute-api.us-east-1.amazonaws.com/default/GetDashBoardData";
            try {
                const res = await fetch(url);
                const data = await res.json();

                // Update Current Occupants
                const insideList = document.getElementById('insideList');
                const peopleIn = data.inside || [];
                
                document.getElementById('occupant-count').textContent = peopleIn.length;
                document.getElementById('active-count').textContent = peopleIn.length;

                if (peopleIn.length === 0) {
                    insideList.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <svg viewBox="0 0 100 100" width="60" height="60">
                                <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
                            </svg>
                            <p>No one in the building</p>
                        </div>
                    `;
                } else {
                    insideList.innerHTML = peopleIn.map(p => {
                        const initial = p.name.charAt(0).toUpperCase();
                        return `
                            <div class="occupant-item">
                                <div class="occupant-icon">${initial}</div>
                                <div class="occupant-name">${p.name}</div>
                            </div>
                        `;
                    }).join('');
                }

                // Update Activity Log - Filter for TODAY only
                const logBody = document.getElementById('logBody');
                
                // Get today's date at midnight
                const todayStart = new Date();
                todayStart.setHours(0, 0, 0, 0);
                const todayTimestamp = todayStart.getTime();
                
                // Filter to only show today's events, sorted newest first
                const logs = (data.all_logs || [])
                    .filter(log => log.timestamp >= todayTimestamp)
                    .sort((a, b) => b.timestamp - a.timestamp);

                document.getElementById('total-entries').textContent = logs.length;

                if (logs.length === 0) {
                    logBody.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 100 100" width="60" height="60">
                                <rect x="20" y="30" width="60" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                                <rect x="20" y="46" width="40" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                                <rect x="20" y="62" width="50" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                            </svg>
                            <p>No recent activity</p>
                        </div>
                    `;
                } else {
                    logBody.innerHTML = logs.map(log => {
                        const actionText = log.action || "Authorized";
                        let actionClass = "denied";
                        let badgeText = actionText;
                        
                        if (actionText === "Entering") {
                            actionClass = "entering";
                            badgeText = "Entry";
                        } else if (actionText === "Exiting") {
                            actionClass = "exiting";
                            badgeText = "Exit";
                        } else if (actionText === "Denied") {
                            actionClass = "denied";
                            badgeText = "Denied";
                        }

                        const time = new Date(log.timestamp);
                        const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        return `
                            <div class="activity-item ${actionClass}">
                                <div class="activity-time">${timeStr}</div>
                                <div class="activity-details">
                                    <div class="activity-name">${log.name}</div>
                                    <div class="activity-action">${actionText}</div>
                                </div>
                                <div class="activity-badge ${actionClass}">${badgeText}</div>
                            </div>
                        `;
                    }).join('');
                }

            } catch (err) {
                console.error("Dashboard error:", err);
            }
        }

        // Clear Activity Feed
        function clearActivity() {
            const logBody = document.getElementById('logBody');
            logBody.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 100 100" width="60" height="60">
                        <rect x="20" y="30" width="60" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                        <rect x="20" y="46" width="40" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                        <rect x="20" y="62" width="50" height="8" rx="4" fill="currentColor" opacity="0.2"/>
                    </svg>
                    <p>No recent activity</p>
                </div>
            `;
            showToast('Activity cleared', 'success');
        }

        // Auto-refresh every 3 seconds for fingerprint data
        setInterval(refreshDashboard, 3000);
        // Auto-refresh every 30 seconds for temperature data
        setInterval(fetchTemperatureData, 30000);
        
        // Initial load
        refreshDashboard();
        fetchTemperatureData();

        // Update system info
        document.getElementById('system-info').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        setInterval(() => {
            document.getElementById('system-info').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
        }, 3000);
    </script>
</body>
</html>
