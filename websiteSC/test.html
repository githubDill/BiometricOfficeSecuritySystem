<!DOCTYPE html>
<html>
<head>
    <title>Security Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; padding: 20px; }
        .box { background: white; border: 1px solid #ccc; padding: 20px; border-radius: 10px; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .flex-container { display: flex; gap: 20px; justify-content: center; margin-top: 20px; width: 100%; max-width: 800px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
        .denied { color: red; font-weight: bold; }
        .authorized { color: green; }
    </style>
</head>
<body>

    <div class="box" style="width: 300px; margin-bottom: 20px;">
        <h3>Enroll New User</h3>
        <input type="text" id="userName" placeholder="Name" style="width: 90%; margin-bottom: 10px;"><br>
        <input type="number" id="userId" placeholder="ID (1-100)" style="width: 90%; margin-bottom: 10px;"><br>
        <button onclick="sendEnroll()" style="width: 100%; height: 40px; background: orange; border: none; cursor: pointer; font-weight: bold;"> 
            START ENROLLMENT 
        </button>
    </div>

    <div class="flex-container">
        <div class="box" style="width: 250px;">
            <h3>In the Building</h3>
            <ul id="insideList" style="list-style: circle; padding-left: 20px;">
                <li>Loading...</li>
            </ul>
        </div>

        <div class="box" style="flex-grow: 1;">
            <h3>Recent Activity</h3>
            <table id="logTable">
                <thead>
                    <tr><th>Time</th><th>Name</th><th>Status</th></tr>
                </thead>
                <tbody id="logBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. SEND ENROLL COMMAND
        async function sendEnroll() {
            const name = document.getElementById('userName').value;
            const id = document.getElementById('userId').value;
            const url = "https://rvejem3755.execute-api.us-east-1.amazonaws.com/default/SendEnrollCommand"; // The one you already have

            if (!name || !id) return alert("Fill in both fields!");
            
            await fetch(url, {
                method: 'POST',
                body: JSON.stringify({ "user_name": name, "user_id": id })
            });
            alert(`Sent: Enroll ${name} at ID ${id}`);
        }

        async function refreshDashboard() {
    const url = "https://77g3ew7bxi.execute-api.us-east-1.amazonaws.com/default/GetDashBoardData"; // Paste your API Gateway URL here
    try {
        const res = await fetch(url);
        const data = await res.json();

        // 1. Update Current Occupants (Who is physically in the building)
        const insideList = document.getElementById('insideList');
        const peopleIn = data.inside || [];
        insideList.innerHTML = peopleIn.map(p => `<li>${p.name}</li>`).join('') || "None";

        // 2. Update the Activity Log (The permanent history)
        const tbody = document.getElementById('logBody');
        tbody.innerHTML = ""; 

        // SORT: Newest scans at the top
        // LIMIT: Only take the top 5 records
        const logs = (data.all_logs || [])
            .sort((a, b) => b.timestamp - a.timestamp)
            .slice(0, 5); 

        logs.forEach(log => {
            // Read the 'action' field we added to the Lambda
            const actionText = log.action || "Authorized"; 
            let color = "red"; // Default for Denied
            
            if (actionText === "Entering") color = "green";
            if (actionText === "Exiting") color = "blue";

            tbody.innerHTML += `
                <tr style="color: ${color}; font-weight: bold;">
                    <td>${new Date(log.timestamp).toLocaleTimeString()}</td>
                    <td>${log.name}</td>
                    <td>${actionText}</td>
                </tr>`;
        });
    } catch (err) {
        console.error("Dashboard error:", err);
    }
}


            // Keep the interval running
            setInterval(refreshDashboard, 3000);
            refreshDashboard();
    </script>
</body>
</html>
